[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slip-pdf-md"
version = "1.0.0"
description = "Satyagraha Law Group SLIP — PDF to Markdown document ingestion"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Satyagraha Law Group" }]
requires-python = ">=3.11"
dependencies = [
  "PyMuPDF>=1.24.0",
  "pytesseract>=0.3.10",
  "Pillow>=10.0.0",
  "numpy>=1.26.0",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
web = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "python-multipart>=0.0.9",
]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
]
all = [
  "slip-pdf-md[web,dev]",
]

[project.scripts]
slip-pdf-md = "slip_pdf_md.cli:main"
pdf-to-markdown = "slip_pdf_md.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
