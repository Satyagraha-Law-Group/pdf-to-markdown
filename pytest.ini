[pytest]
testpaths = tests
pythonpath = src .
addopts = -q
markers =
    smoke: import, CLI help, doctor, folder init
    unit: naming, fingerprints, citations, cleaning, split math, paths
    functionality: convert text PDF, front matter, page headings
    integration: RAW-READY-CLEAN-PROCESSED, GUBERNATIO gate, lease, approve, report
    system: sequential convert, registry backup/restore, GUBERNATIO list fields
    uat: lawyer photocopier story
    security: no raw keys, SECRETS gitignore, dummy key, fingerprint only
    integrity: verify/fidelity, required YAML, companion recall
    regression: duplicate of DONE/AWAITING does not reconvert
    performance: small PDF convert under a generous timeout
